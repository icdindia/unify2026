{
 id:'public', name:'Public Sector & Government Procurement',
 desc:'Municipal, state, federal and transit awards, usually on the buyer’s paper and funded by a programme with conditions.',
 segs:['Cities & municipalities','State DOTs','Federal agencies','K-12 & higher education','Transit authorities'],
 corpus:{docs:11, clauses:296, parties:11, label:'executed public awards'},
 issues:[
  {id:'BAB-01',n:'Build America, Buy America and NEVI compliance',c:'Compliance',r:'critical',conflict:1,
   cl:['§3 Specifications','§10 Representations & Warranties','Exhibit F Certifications'],
   w:'A blanket compliance representation covers models and components that may change between award and delivery. The certification has to attach to what actually ships.',
   p:[P('CP Template','Certify compliance per order against the bill of materials for the models shipped, with supporting documentation on request.','Standard — no approval','ChargePoint certifies that Stations identified in each Order meet the Build America, Buy America requirements applicable to the Project as of the Order date.'),
      P('Also acceptable','Contract-level certification for the models listed at award, refreshed on any model substitution.','Contracts Manager'),
      P('Fallback 1','Contract-level certification with a substitution right where a waiver is granted or the programme rules change.','Associate GC + Compliance','Where a general applicability waiver applies or programme requirements change, ChargePoint may substitute equivalent Stations upon notice.'),
      P('Red line','Unqualified, perpetual certification covering components ChargePoint does not manufacture.','Do not concede — GC + Chief Compliance Officer')]},
  {id:'APP-01',n:'Non-appropriation and funding-out',c:'Commercial',r:'critical',
   cl:['§2 Term','§14 Termination','§4 Payment'],
   w:'Public buyers cannot bind future budgets. The question is not whether to accept non-appropriation but what ChargePoint recovers when it is invoked.',
   p:[P('CP Template','Non-appropriation accepted on 60 days’ notice, with all costs incurred and unamortised hardware payable from appropriated funds.','Standard — no approval','Upon non-appropriation, Customer shall pay for Services rendered and the unamortised cost of Stations delivered prior to the termination date.'),
      P('Also acceptable','Same, with hardware title transferring to the buyer on payment.','Contracts Manager'),
      P('Fallback 1','Costs incurred payable; unamortised hardware recovered by removing and retaining the stations instead of payment.','Associate GC'),
      P('Red line','Non-appropriation with no payment for delivered hardware and no right to remove it.','Do not concede — GC + CFO')]},
  {id:'LOL-02',n:'Liability cap against a sovereign counterparty',c:'Risk allocation',r:'critical',
   cl:['§12 Limitation of Liability','§11 Indemnification','§15 Governing Law'],
   w:'Public entities often cannot cap their own liability or indemnify. A mutual cap is usually unavailable, so the ask is a one-way cap that survives.',
   p:[P('CP Template','Mutual cap at 12 months of fees where the entity is permitted to agree one.','Standard — no approval','Each party’s aggregate liability shall not exceed the fees paid in the twelve (12) months preceding the claim, to the extent permitted by applicable law.'),
      P('Also acceptable','One-way cap protecting ChargePoint at 12 months of fees; the entity’s liability left to statute.','Contracts Manager'),
      P('Fallback 1','One-way cap at 2× annual fees with IP indemnity and data-breach liability carved out.','Associate GC'),
      P('Red line','No cap on ChargePoint’s liability while the entity relies on sovereign immunity.','Do not concede — GC')]},
  {id:'WAG-01',n:'Prevailing wage and Davis-Bacon',c:'Compliance',r:'elevated',
   cl:['§7 Labor Standards','§4 Payment','Exhibit A Scope of Work'],
   w:'Wage determinations move between bid and installation. Where the installer is a subcontractor, the compliance obligation and the cost land in different places.',
   p:[P('CP Template','Prevailing wage flows to the installing subcontractor; pricing assumes the wage determination current at bid.','Standard — no approval','Pricing is based on the wage determination in effect on the Proposal Date. Changes to the applicable determination shall be treated as a Change Order.'),
      P('Also acceptable','ChargePoint carries certified payroll reporting for its subcontractors at no additional fee.','Contracts Manager'),
      P('Fallback 1','Fixed price inclusive of wage determination changes, priced with a contingency approved by Finance.','VP Delivery + CFO'),
      P('Red line','Fixed price with no change-order right for a wage determination issued after bid.','Do not concede — CFO')]},
  {id:'FOI-01',n:'Public records requests and confidentiality',c:'Data & IP',r:'elevated',
   cl:['§9 Confidentiality'],
   w:'Pricing and configuration filed with a public buyer can be disclosed on request. Notice before disclosure is the only practical protection.',
   p:[P('CP Template','Marked materials treated as exempt to the extent the law allows, with written notice before any disclosure and a chance to object.','Standard — no approval','Customer shall notify ChargePoint at least ten (10) business days prior to disclosing materials marked confidential, and shall permit ChargePoint to seek a protective order.'),
      P('Also acceptable','Notice reduced to five business days.','Contracts Manager'),
      P('Fallback 1','Notice only where the entity’s procedures permit, with ChargePoint bearing the cost of any objection.','Associate GC'),
      P('Red line','No notice and no marking mechanism for pricing or technical materials.','Do not concede — GC')]},
  {id:'TFC-02',n:'Termination for convenience and settlement costs',c:'Commercial',r:'elevated',
   cl:['§14 Termination','§4 Payment'],
   w:'Federal-style convenience termination is standard and not worth fighting. Recovery of settlement costs is, and it is routinely struck.',
   p:[P('CP Template','Convenience termination accepted with payment for work performed, committed costs and unamortised hardware.','Standard — no approval','Upon termination for convenience, Customer shall pay for Services performed, non-cancellable committed costs and the unamortised cost of delivered Stations.'),
      P('Also acceptable','Same, with committed costs limited to purchase orders placed before the notice date.','Contracts Manager'),
      P('Fallback 1','Work performed and delivered hardware only, with ChargePoint entitled to remove undelivered equipment.','Associate GC'),
      P('Red line','Convenience termination with payment only for accepted deliverables.','Do not concede — CFO')]},
  {id:'CYB-01',n:'StateRAMP, FedRAMP and NIST 800-171',c:'Compliance',r:'critical',
   cl:['Security Exhibit C','§10 Representations & Warranties'],
   w:'Security authorisation is a programme with a cost and a calendar. Committing to an authorisation ChargePoint does not hold is a representation, not an aspiration.',
   p:[P('CP Template','Represent the authorisations actually held as of the effective date; describe the roadmap without committing to a date.','Standard — no approval','ChargePoint represents that the Services hold the authorisations listed in Exhibit C as of the Effective Date.'),
      P('Also acceptable','Commit to maintaining current authorisations for the term and to notify on any change of status.','Security Director'),
      P('Fallback 1','Commit to a named authorisation by a stated date, with the date approved by Security and Finance before it goes in writing.','CISO + CFO'),
      P('Red line','Warranting an authorisation not yet held, or accepting termination for cause tied to an authorisation date.','Do not concede — CISO + GC')]},
  {id:'AUD-01',n:'Audit rights and records retention',c:'Compliance',r:'standard',
   cl:['§13 Audit','§9 Confidentiality'],
   w:'Grant-funded awards carry audit rights that outlive the contract. The scope needs a boundary so it does not become access to unrelated commercial records.',
   p:[P('CP Template','Audit limited to records relating to the award, on 30 days’ notice, during business hours, once per year, retained for three years after final payment.','Standard — no approval','Customer may audit records directly relating to this Agreement upon thirty (30) days’ notice, not more than once per Contract Year.'),
      P('Also acceptable','Retention extended to four years to match the funding programme.','Contracts Manager'),
      P('Fallback 1','Retention to the programme period plus three years, with audit scope still limited to award-related records.','Associate GC'),
      P('Red line','Unrestricted access to ChargePoint books, or audit of pricing build-up on a fixed-price award.','Do not concede — GC + CFO')]}
 ],

{
 id:'utility', name:'Utility Program & Make-Ready Agreement',
 desc:'Participation in a utility make-ready, rebate or managed-charging programme, with the conditions attached to the money.',
 segs:['Investor-owned utilities','Municipal utilities','Rural co-operatives'],
 corpus:{docs:7, clauses:154, parties:6, label:'executed programme agreements'},
 issues:[
  {id:'MRY-01',n:'Make-ready cost allocation and infrastructure ownership',c:'Commercial',r:'critical',conflict:1,
   cl:['§3 Scope','§2 Title','Exhibit A Design'],
   w:'The demarcation point decides who pays for the transformer and who owns it afterwards. Programmes describe it differently from one territory to the next.',
   p:[P('CP Template','Utility funds and owns to the customer side of the meter; ChargePoint owns the stations and everything downstream.','Standard — no approval','Utility shall fund and own Make-Ready Infrastructure up to and including the Meter. Title to Stations and downstream equipment remains with ChargePoint.'),
      P('Also acceptable','Utility funds to the meter; the site host owns the panel and conduit, ChargePoint owns the stations.','Contracts Manager'),
      P('Fallback 1','Utility owns all infrastructure including the pedestals, with ChargePoint granted a licence for the term.','Associate GC'),
      P('Red line','Utility ownership of the stations or of the charge management software.','Do not concede — GC + VP Product')]},
  {id:'CLW-01',n:'Incentive claw-back on early removal or under-use',c:'Risk allocation',r:'critical',conflict:1,
   cl:['§6 Incentives','§11 Repayment','§2 Term'],
   w:'Programme money comes with a five to ten year operating condition. If the site host closes the site in year three, someone repays the utility.',
   p:[P('CP Template','Claw-back obligation sits with the site host, who receives the incentive benefit; ChargePoint is a facilitator.','Standard — no approval','Repayment obligations arising under the Program shall be borne by the Site Host as the recipient of the Program benefit.'),
      P('Also acceptable','Claw-back pro-rated over the programme period, with ChargePoint liable only for its own removal of stations.','Contracts Manager'),
      P('Fallback 1','ChargePoint carries a pro-rated claw-back with a three-year floor, backed to back with the site host agreement.','Associate GC + CFO','ChargePoint’s repayment obligation shall be pro-rated over the Program Period and shall not apply after the third anniversary of Energisation.'),
      P('Red line','Full claw-back exposure with no back-to-back recovery from the site host.','Do not concede — CFO')]},
  {id:'DRP-01',n:'Demand response participation obligations',c:'Performance',r:'elevated',
   cl:['§7 Energy Management','§5 Performance','§9 Service Levels'],
   w:'Curtailment obligations to the utility collide directly with availability promises to the customer. The two documents have to be read against each other.',
   p:[P('CP Template','Participation on a best-efforts basis within limits the customer has agreed, with curtailment excluded from any uptime measure.','Standard — no approval','Curtailment performed under the Program shall be excluded from the calculation of Uptime and Availability.'),
      P('Also acceptable','Defined number of events per year with a stated maximum duration.','Contracts Manager'),
      P('Fallback 1','Firm curtailment commitment with performance penalties capped at the incentive value received.','VP Energy + Associate GC'),
      P('Red line','Firm curtailment with penalties exceeding the incentive, or utility control over stations without customer consent.','Do not concede — VP Energy')]},
  {id:'DTA-01',n:'Data sharing with the utility and the regulator',c:'Data & IP',r:'elevated',
   cl:['§8 Data Rights','DPA §4','§10 Confidentiality'],
   w:'Programmes require reporting that regulators can publish. Session-level data that identifies a driver cannot travel that route.',
   p:[P('CP Template','Aggregated, de-identified reporting at the intervals the programme requires; no driver-level records.','Standard — no approval','Reporting shall be provided in aggregated, de-identified form. ChargePoint shall not provide driver-identifiable data under the Program.'),
      P('Also acceptable','Site-level and session-level data with driver identifiers removed at source.','Contracts Manager'),
      P('Fallback 1','Session-level data with pseudonymous identifiers, subject to the utility’s written confidentiality undertaking.','Privacy Counsel'),
      P('Red line','Driver-identifiable data, or data sharing with no confidentiality undertaking.','Do not concede — Privacy Counsel + GC')]},
  {id:'RUL-01',n:'Mid-term programme rule changes',c:'Compliance',r:'elevated',
   cl:['§12 Change in Law','§6 Incentives'],
   w:'Programme rules are set by a regulator, not by the utility, and they change. The agreement has to say what happens when the rules move under a signed deal.',
   p:[P('CP Template','Rule changes apply prospectively; ChargePoint may terminate participation without penalty if the economics change materially.','Standard — no approval','Program modifications shall apply prospectively. ChargePoint may withdraw from the Program without penalty where a modification materially alters the economics.'),
      P('Also acceptable','Prospective application, with a 90-day window to renegotiate before withdrawal.','Contracts Manager'),
      P('Fallback 1','Rule changes bind, but incentives already earned are not disturbed and claw-back is measured against the original rules.','Associate GC'),
      P('Red line','Retroactive rule changes that reopen incentives already paid.','Do not concede — GC + CFO')]},
  {id:'UPT-01',n:'Uptime reporting required by the programme',c:'Performance',r:'standard',
   cl:['§9 Service Levels','§8 Data Rights'],
   w:'Programme uptime definitions rarely match the contractual one. Reporting to two different definitions from one dataset is how compliance findings happen.',
   p:[P('CP Template','Report on the programme’s definition, with exclusions stated on the face of the report.','Standard — no approval','Uptime reports shall state the measurement methodology and all Excused Downtime applied.'),
      P('Also acceptable','Adopt the programme definition contractually so one number serves both.','Contracts Manager'),
      P('Fallback 1','Meet the programme threshold as a contractual commitment, with credits capped at the incentive value.','VP Services'),
      P('Red line','Programme uptime as a contractual warranty with penalties outside the liability cap.','Do not concede — GC')]}
 ],
 qs:[
  {issue:'MRY-01',

   opts:[

/* ============================== tooltip ============================== */
const $tip = (()=>{ const el=document.createElement('div'); el.className='tip'; el.setAttribute('data-on','false');
  document.body.appendChild(el); return el; })();
let tipFor=null;
function showTip(el){
 const txt = el.getAttribute('data-tip'); if(!txt) return;
 tipFor=el; $tip.textContent=txt; $tip.setAttribute('data-on','false'); $tip.style.left='0px'; $tip.style.top='0px';
 const r=el.getBoundingClientRect(), t=$tip.getBoundingClientRect();
 let side='top', top=r.top-t.height-8;
 if(top<8){ side='bottom'; top=r.bottom+8; }
 let left=r.left+r.width/2-t.width/2;
 const max=window.innerWidth-t.width-8;
 if(left<8) left=8; if(left>max) left=Math.max(8,max);
 const ax=Math.min(Math.max(r.left+r.width/2-left,12),Math.max(12,t.width-20));
 $tip.style.setProperty('--tipx',(ax-4)+'px');
 $tip.setAttribute('data-side',side);
 $tip.style.left=Math.round(left)+'px'; $tip.style.top=Math.round(top)+'px';
 $tip.setAttribute('data-on','true');
}
function hideTip(){ tipFor=null; $tip.setAttribute('data-on','false'); }
document.addEventListener('pointerover',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]');
  if(el!==tipFor){ el?showTip(el):hideTip(); } });
document.addEventListener('pointerdown',hideTip);
document.addEventListener('focusin',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]'); el?showTip(el):hideTip(); });
window.addEventListener('scroll',hideTip,true);

function threadHead(){

function cardFoot(t){

}

const LEARN_STEPS = [
 ['Opening the executed agreements','{N} documents'],
 ['Matching against the provision library','{K} of {K} matched'],
 ['Reading how each position actually settled','{C} clauses'],
 ['Looking for provisions the library does not have','{NEW} found'],
 ['Checking the template against what was signed','{CF} conflicts']
];
function learnVals(){
 const t=T(); return {N:docsFor(t), K:t.issues.length, C:t.corpus.clauses,
  NEW:t.issues.filter(i=>i.isNew).length, CF:t.issues.filter(i=>i.conflict).length};
}
function renderSteps(){
 const v = learnVals();
 return `<div class="steps">${LEARN_STEPS.map((s,i)=>{
   const done = i < S.learnStep, now = i === S.learnStep;
   const res = s[1].replace(/\{(\w+)\}/g,(m,k)=>v[k]);
   return `<div class="step ${done||now?'on':''}">
     <span class="tick">${done?ICON.tick:(now?'<span class="spin"></span>':'')}</span>
     <span>${esc(s[0])}</span><span class="res">${done?esc(res):''}</span></div>`;}).join('')}</div>`;
}
function renderFindings(){
 const t=T(), v=learnVals();
 const settled = t.issues.length - t.issues.filter(i=>i.conflict).length - t.issues.filter(i=>i.isNew).length;
 const news = t.issues.filter(i=>i.isNew), conf = t.issues.filter(i=>i.conflict);
 return `<div class="findings">
  <div class="finding"><span class="n">${settled}</span><span class="t">provisions your team settled the same way every time. I have taken those as standard and I will not ask about them.</span></div>
  ${news.length?`<div class="finding"><span class="n">${news.length}</span><span class="t">provisions the library did not have, found on counterparty paper and now added: ${news.map(n=>'<b>'+esc(n.n)+'</b>').join(', ')}.</span></div>`:''}
  <div class="finding"><span class="n">${conf.length}</span><span class="t">places where what you signed contradicts your own template. ${conf.length===1?'That is':'Those are'} the only ${conf.length===1?'thing':'things'} I need you to decide.</span></div>
  <div class="finding"><span class="n">${v.C}</span><span class="t">clauses read across ${v.N} agreements and ${t.corpus.parties} counterparties.</span></div>
 </div>`;
}

function runSummary(){
 const t=T(), n=docsFor(t);
 const news = t.issues.filter(i=>i.isNew), conf = t.issues.filter(i=>i.conflict);
 const settled = t.issues.length - conf.length - news.length;
 const skipped = (S.deferred||[]).length, answered = S.answers.length - skipped;
 const cls = new Set(t.issues.flatMap(i=>i.cl)).size, fb2 = t.issues.filter(i=>i.fb===2).length;
 return [
  [n, `${esc(t.corpus.label)} read from <b>${esc(srcName())}</b>, plus the version history on the same files.`],
  [settled, `provisions your team settled identically every time. Taken as standard — I did not ask about them.`],
  [news.length, `provision${news.length===1?'':'s'} found on counterparty paper that the library did not have: ${news.map(x=>'<b>'+esc(x.n)+'</b>').join(', ')}. Added to the inventory.`],
  [S.answers.length, `questions asked — ${answered} answered, ${skipped} skipped. Skipped ones are parked in <button class="jump" type="button" data-jump="defer">Deferred decisions</button>, not decided for you.`],
  [t.issues.length, `provisions written across five tiers, ${fb2} of them with a second approved fallback, mapped to ${cls} clauses with approvers routed.`]
 ];
}
function renderSummary(){
 const t=T();
 const conf = t.issues.filter(i=>i.conflict), off = t.issues.filter(i=>i.offPaper);
 const eyes = [];
 conf.forEach(i=>{ if(S.fromAnswer[i.id]) eyes.push(
   `<b>${esc(i.n)}</b> — your signed paper and your template disagreed. You chose “${esc(S.fromAnswer[i.id])}”, and that is now the standard. <button class="jump" type="button" data-open="${i.id}">Open provision ${i.num}</button>`); });
 off.forEach(i=>eyes.push(
   `<b>${esc(i.n)}</b> is not in ChargePoint paper at all — it arrives on theirs. The opening position is to strike it. <button class="jump" type="button" data-jump="cp">See counterparty-introduced</button>`));
 (S.deferred||[]).forEach(d=>eyes.push(
   `<b>${esc(d.q)}</b> — you skipped this, so it is parked rather than decided. <button class="jump" type="button" data-jump="defer">Deferred decisions</button>`));
 return `<div class="msg msg-bot fade" style="gap:14px">
  <div class="turn-head"><span class="dot-agent"></span><span class="label">What I did</span></div>
  <div class="sumcard">${runSummary().map(([n,txt])=>`<div class="sum-i"><span class="n">${n}</span><span class="t">${txt}</span></div>`).join('')}</div>
  ${eyes.length?`<div class="eye"><span class="label">Worth your eye</span>
    ${eyes.map(e=>`<div class="eye-i"><span class="rdot elevated" style="margin-top:7px"></span><span>${e}</span></div>`).join('')}</div>`:''}
  ${artifactCard()}
 </div>`;
}

function renderDock(){
 const d = document.getElementById('dock'); if(!d) return;
 const ph = S.stage==='playbook' ? 'Ask for a change to the playbook'
   : S.stage==='ask' ? 'Or ask me something about this playbook'
   : 'Add context, or drop a document';
 d.innerHTML = (S.stage==='ask' ? questionCard() : '') + composerHTML(ph);

 if(S.stage==='ask'){
  const q = allQs()[S.qi];
  if(S.pendingPerm){
   d.querySelectorAll('[data-perm]').forEach(b=>b.onclick=()=>{
     const v=b.dataset.v, pend=S.pendingPerm; S.perms[pend]=v; S.pendingPerm=null;

   d.querySelectorAll('[data-disc]').forEach(b=>b.onclick=()=>{ const k=b.dataset.disc; S.open[k]=!S.open[k]; renderDock(); });

      why:'Parked from the interview — the playbook uses what the precedent says until someone decides.',

 }

}

/* ============================== flow ============================== */
function homeGrant(v){
 S.perms.docsource = v; S.homeConnect = false;
 if(v!=='denied'){ S.connected = true; S.unclass = UNCLASS_SEED.slice(); }
 render();
}

function pickType(id){
 S.type = id; S.stage='sources'; S.thread=[];
 const t = T(), cls = new Set(t.issues.flatMap(i=>i.cl));
 S.thread.push({k:'user',text:t.name});
 S.thread.push({k:'agent',html:`
  <div class="turn-head"><span class="dot-agent"></span><span class="label">Playbook Studio</span></div>
  <p class="lead">I hold <strong>${t.issues.length} negotiation provisions</strong> for this contract type, mapped to <strong>${cls.size} clauses</strong> across the ChargePoint paper — caps, data rights, uptime, termination, the usual shape of the argument.</p>
  <p class="lead">${S.connected
    ? 'I have already read your '+docsFor(t)+' executed agreements of this type from '+srcName()+'. One more thing worth having: the signed file tells me where you <em>landed</em>, not what you <em>gave up</em> to get there. That is in the version history.'
    : 'That library is generic. To make the positions <em>yours</em>, I need to read what ChargePoint has actually signed — that is the difference between what the template says and what your team defends.'}</p>`});
 S.thread.push({k:'perm',id: S.connected ? 'redlines' : 'docsource'});
 render();
}

function answerPerm(id,v){
 S.perms[id]=v;
 if(id==='docsource' && v!=='denied'){ S.connected = true; if(!S.unclass) S.unclass = UNCLASS_SEED.slice(); }
 if(id==='docsource'){
   S.thread.push({k:'agent',html:`<p class="lead">${v==='denied'
     ? 'Understood. I will work from the library alone — the positions will be sound but generic, and I will ask you more questions than I otherwise would.'
     : srcName()+' is connected. One more, and it is the one that actually matters: the signed file tells me where you <em>landed</em>, not what you <em>gave up</em> to get there. That is in the version history.'}</p>`});
   if(v!=='denied'){ S.thread.push({k:'perm',id:'redlines'}); }
   else { S.thread.push({k:'drop'}); startLearning(); }
 } else if(id==='redlines'){
   S.thread.push({k:'drop'});
   startLearning();
 }
 render();
}

function startLearning(){
 if(S.learnStarted) return; S.learnStarted = true;
 S.stage='learn'; S.learnStep=0;
 S.thread.push({k:'agent',html:`<div class="turn-head"><span class="dot-agent"></span><span class="label">Reading</span></div>`});
 S.thread.push({k:'steps'});
 render();
 const step = ()=>{
   S.learnStep++;
   if(S.learnStep <= LEARN_STEPS.length){ render(); setTimeout(step, 620); }
   else finishLearning();
 };
 setTimeout(step, 700);
}

function finishLearning(){
 const t=T(), conf=t.issues.filter(i=>i.conflict).length;
 S.thread.push({k:'agent',html:`<div class="turn-head"><span class="dot-agent"></span><span class="label">What I found</span></div>`});
 S.thread.push({k:'findings'});
 S.thread.push({k:'agent',html:`<p class="lead">I can answer <strong>${t.issues.length - conf} of ${t.issues.length}</strong> provisions from your own precedent without asking you anything. The rest need a human decision, so I will ask <strong>${allQs().length} questions</strong> — one at a time, below.</p>`});
 S.stage='ask'; S.qi=0;
 t.issues.forEach(i=>{ S.sel[i.id]=0; });
 render();
}

function chooseOption(i,label,free){
 const qs = allQs(), q = qs[S.qi];
 S.answers.push({q:q.q,a:label});
 S.thread.push({k:'user',text:label});
 if(q.issue && i!=='skip' && !free){
   const set = q.opts[i].set;
   if(typeof set === 'number'){ S.sel[q.issue]=set; S.fromAnswer[q.issue]=label; }
 }
 if(q.approval){ S.approval = label; }
 if(i==='skip'){ S.deferred.push({q:q.q, why:'Skipped during the interview — the playbook uses what the precedent says until someone decides.',
   owner:'CLM — Commercial Legal', due:'Before this playbook is published', skipped:true}); }
 S.qi++;
 if(S.qi >= qs.length){
   finishInterview();
 } else render();
}

function finishInterview(){
 S.thread.push({k:'agent',html:`<p class="lead">That is everything. Drafting the playbook — positions set across five tiers, approvers routed, every provision mapped to the clauses it moves.</p>`});
 S.stage='learn'; render();

}

function submitFree(v){
 if(v==='__attach__'){
   if(S.stage==='start'){ pickType('msa'); return; }
   S.thread.push({k:'user',text:'Attached: ChargePoint_MSA_Template_v7.docx'});
   S.thread.push({k:'agent',html:`<p class="lead">Read it. It matches the template I already had, with one difference in the uptime exhibit — I have taken the newer one.</p>`});
   render(); return;
 }
 const s = (v||'').trim(); if(!s) return;
 if(S.stage==='start'){
   const hit = TYPES.find(t=> s.toLowerCase().includes(t.id) )
     || (/site host|landlord|property|reit|multifamily/i.test(s) ? TYPES[2]
     : /fleet|depot|caas|bus|van/i.test(s) ? TYPES[1]
     : /reseller|partner|channel|distributor|dealer/i.test(s) ? TYPES[3]
     : /nda|non-disclos|confidential/i.test(s) ? TYPES[6]
     : /city|state|federal|municipal|nevi|transit|public/i.test(s) ? TYPES[4]
     : /utility|make-ready|rebate|demand response/i.test(s) ? TYPES[5]
     : /dpa|gdpr|privacy|processor/i.test(s) ? TYPES[8]
     : /contractor|installer|subcontract|electrician/i.test(s) ? TYPES[7]
     : TYPES[0]);
   S.type = hit.id; S.stage='sources'; S.thread=[];
   const cls = new Set(hit.issues.flatMap(i=>i.cl));
   S.thread.push({k:'user',text:s});
   S.thread.push({k:'agent',html:`
     <div class="turn-head"><span class="dot-agent"></span><span class="label">Playbook Studio</span></div>
     <p class="lead">That reads as a <strong>${esc(hit.name)}</strong>. I hold <strong>${hit.issues.length} provisions</strong> for it, across <strong>${cls.size} clauses</strong>. Say so if I have picked the wrong shape.</p>
     <p class="lead">${S.connected
       ? 'I have already read your executed agreements from '+srcName()+'. One more source worth having before I start.'
       : 'Before I ask you anything, I want to read what ChargePoint has already signed.'}</p>`});
   S.thread.push({k:'perm',id: S.connected ? 'redlines' : 'docsource'});
   render(); return;
 }
 S.thread.push({k:'user',text:s});
 S.thread.push({k:'agent',html:`<p class="lead">Noted — I have folded that into the playbook.</p>`});
 render();
}

 critical:'Critical risk — a bad outcome here can sink the deal or the margin.',

function freqTip(i){
 const t=T(), n=docsFor(t);
 if(!i.freq) return `Accepted as drafted in all ${n} ${t.corpus.label} — no counterparty has moved it.`;
 return `Negotiated in ${Math.round(n*i.freq/100)} of ${n} ${t.corpus.label} · most often settled at ${TIER[i.settled]} · ${i.rounds.toFixed(1)} rounds on average.`;
}
function citeTip(k,n,tier){
 return k ? `${k} of ${n} executed agreements closed at ${tier}.`
          : `No executed agreement has closed at ${tier} — this position has never been conceded.`;
}

function tierCounts(i,n){
 const negs=Math.round(n*i.freq/100), base=n-negs, c=[0,0,0,0,0];
 if(negs){
  const raw=[0,1,2,3,4].map(t=>Math.pow(.38,Math.abs(t-i.settled)));
  const sum=raw.reduce((a,b)=>a+b,0);
  const share=raw.map(x=>negs*x/sum), fl=share.map(Math.floor);
  let left=negs-fl.reduce((a,b)=>a+b,0);
  const order=share.map((x,k)=>[x-fl[k],k]).sort((a,b)=>b[0]-a[0]);
  for(let k=0;k<left;k++) fl[order[k%5][1]]++;
  for(let k=0;k<5;k++) c[k]=fl[k];
 }
 c[0]+=base;
 return c;
}
function citeLabel(k,n){
 return k ? `<b>${k}</b> of ${n} agreements` : 'No precedent';
}

 const t=T();
 const reds = t.issues.map(i=>({i,p:i.p.find(x=>x.t==='Red line')})).filter(x=>x.p);
 const cost = t.issues.slice().sort((a,b)=>(b.freq*b.rounds)-(a.freq*a.rounds)).slice(0,5);
 const crit = t.issues.filter(i=>i.r==='critical');
 return `<div class="qgrid">
  <div class="qbox span">
    <div class="label">Red lines — do not accept without the General Counsel</div>
    <div class="qlist">${reds.map(x=>`<div class="qitem">
      <span class="qi">${x.i.ref.replace('Template ','')}</span>
      <span class="qt"><b>${esc(x.i.n)}</b> — ${esc(x.p.x)}</span></div>`).join('')}</div>
  </div>
  <div class="qbox">
    <div class="label">Where the time goes</div>
    <div class="qlist">${cost.map((i,ix)=>`<div class="qitem">
      <span class="qi">${ix+1}</span>
      <span class="qt"><b>${esc(i.n)}</b><br><span class="sm">${i.freq}% of deals · ${i.rounds.toFixed(1)} rounds</span></span></div>`).join('')}</div>
  </div>
  <div class="qbox">
    <div class="label">Critical provisions — ${crit.length}</div>
    <div class="qlist">${crit.map(i=>`<div class="qitem">
      <span class="qi">${i.num}</span>
      <span class="qt"><b>${esc(i.n)}</b><br><span class="sm">Standard: ${esc(i.p[S.sel[i.id]||0].t)} · ${esc(i.p[S.sel[i.id]||0].a)}</span></span></div>`).join('')}</div>
  </div>
  <div class="qbox span">
    <div class="label">Approval routing</div>
    <div class="qlist">
      <div class="qitem"><span class="qi">Tier 1–2</span><span class="qt">CP Template and Also acceptable — <b>no approval</b>, sign as drafted.</span></div>
      <div class="qitem"><span class="qi">Tier 3</span><span class="qt">Fallback 1 — <b>${esc((S.approval||'Contracts Manager to $250k ACV, then Associate GC').split('—')[0].trim())}</b>.</span></div>
      <div class="qitem"><span class="qi">Tier 4</span><span class="qt">Fallback 2 — <b>always above the Contracts Manager</b>; see the approver named on each provision.</span></div>
      <div class="qitem"><span class="qi">Red line</span><span class="qt"><b>General Counsel only.</b> Not delegable at any deal size.</span></div>
    </div>
  </div>
 </div>`;
}

function renderClauses(){
 const list = T().issues, map = {};
 list.forEach(i=>i.cl.forEach(c=>{ (map[c]=map[c]||[]).push(i); }));
 const rank = {critical:0,elevated:1,standard:2};
 const rows = Object.entries(map).sort((a,b)=>{
   const ra = Math.min(...a[1].map(i=>rank[i.r])), rb = Math.min(...b[1].map(i=>rank[i.r]));
   return ra-rb || b[1].length-a[1].length || a[0].localeCompare(b[0]);
 });
 return `<p class="lead" style="max-width:70ch;margin-bottom:var(--s4)">The same inventory read from the clause side — every section of ${esc(T().template)}, and which provisions move it. Counterparty sections are mapped onto ChargePoint numbering so one reference means one thing across all ${docsFor(T())} agreements.</p>
 <div class="table-scroll"><table class="ctable">
  <thead><tr><th>Clause</th><th>Provisions that move it</th><th>Highest risk</th><th>Standard position</th></tr></thead>
  <tbody>${rows.map(([c,is])=>{
    const top = is.slice().sort((a,b)=>rank[a.r]-rank[b.r])[0], sel = S.sel[top.id]||0;
    return `<tr>
      <td class="cref">${esc(c)}</td>
      <td><div class="cls">${is.map(i=>`<button class="cl" type="button" data-goto="${i.id}" style="display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-size:12.4px">${'<span class="rdot '+i.r+'"></span>'}${i.num} ${esc(i.n)}</button>`).join('')}</div></td>
      <td><span style="display:inline-flex;align-items:center;gap:7px;font-size:12.4px;color:var(--text-soft)"><span class="rdot ${top.r}"></span>${top.r[0].toUpperCase()+top.r.slice(1)}</span></td>
      <td style="max-width:320px"><span class="doc" style="font-size:var(--t2)">${esc(top.p[sel].x)}</span></td>
    </tr>`;}).join('')}</tbody></table></div>`;
}

function bindPlaybook($doc){
 $doc.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); });
 $doc.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{ S.show=b.dataset.show; render(); });
 const rs=document.getElementById('riskSel'); if(rs) rs.onchange=()=>{ S.filter=rs.value; render(); };
 $doc.querySelectorAll('[data-issue]').forEach(b=>b.onclick=()=>{ const k='i'+b.dataset.issue; S.open[k]=!S.open[k]; render(); });
 $doc.querySelectorAll('[data-prov]').forEach(b=>b.onclick=()=>{ S.sel2=b.dataset.prov; render(); });
 const hm=document.getElementById('pheadMore'); if(hm) hm.onclick=()=>{ S.headOpen=!S.headOpen; render(); };
 $doc.querySelectorAll('[data-provoff]').forEach(b=>b.onclick=()=>{
   const id=b.dataset.provoff; S.provOff[id]=!S.provOff[id]; render(); });
 $doc.querySelectorAll('[data-tgl]').forEach(b=>b.onclick=()=>{ const [id,pi]=b.dataset.tgl.split(':');
   S.tierOff[id]=S.tierOff[id]||{}; S.tierOff[id][pi]=!S.tierOff[id][pi]; render(); });
 const lf=document.getElementById('listFilter'); if(lf) lf.onclick=()=>{ S.listTools=!S.listTools; render(); };
 const ls=document.getElementById('listSearch'); if(ls) ls.onclick=()=>{ S.listSearch=!S.listSearch; render();
   requestAnimationFrame(()=>{ const n=document.getElementById('provSearch'); if(n) n.focus(); }); };
 $doc.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ const k=b.dataset.lang; S.langOpen[k]=!S.langOpen[k]; render(); });
 $doc.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{
   const [id,pi]=b.dataset.pos.split(':'); S.sel[id]=+pi;
   if(S.tierOff[id]) delete S.tierOff[id][pi]; render(); });
 $doc.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{
   S.tab='all'; S.filter='all'; S.show='all'; S.psearch=''; S.sel2=b.dataset.goto; render(); });
 const ea=document.getElementById('expAll'); if(ea) ea.onclick=()=>{ provList().forEach(i=>S.open['i'+i.id]=true); render(); };
 const ca=document.getElementById('colAll'); if(ca) ca.onclick=()=>{ T().issues.forEach(i=>delete S.open['i'+i.id]); render(); };
 const ps=document.getElementById('provSearch');
 if(ps) ps.oninput=()=>{ const at=ps.selectionStart; S.psearch=ps.value; render();
   const n2=document.getElementById('provSearch'); if(n2){ n2.focus(); n2.setSelectionRange(at,at); } };
 const src=document.getElementById('srcBtn'); if(src) src.onclick=()=>{ S.sheet='perms'; render(); };
 const pub=document.getElementById('pubBtn'); if(pub) pub.onclick=()=>{
   pub.textContent='Published to '+srcName(); pub.disabled=true; pub.style.opacity='.7'; };
}

/* ============================== sheets ============================== */
function renderSheet(){
 const host = document.getElementById('sheetHost');
 if(!S.sheet){ host.innerHTML=''; return; }
 host.innerHTML = `<div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet fade" role="dialog" aria-label="${S.sheet==='unclass'?'Unclassified files':'Permissions'}">
    <div class="sheet-h"><span class="label">${S.sheet==='unclass'?'Files I could not place':'Permissions'}</span><span class="spacer"></span>
      <button class="btn btn--sm btn--quiet" id="sheetClose">Close</button></div>
    ${S.sheet==='unclass'?sheetUnclass():sheetPerms()}
  </div>`;
 document.getElementById('sheetBg').onclick=()=>{S.sheet=false;render();};
 document.getElementById('sheetClose').onclick=()=>{S.sheet=false;render();};
 host.querySelectorAll('[data-sheet-revoke]').forEach(b=>b.onclick=()=>{delete S.perms[b.dataset.sheetRevoke];render();});
 host.querySelectorAll('[data-sheet-always]').forEach(b=>b.onclick=()=>{S.perms[b.dataset.sheetAlways]='always';render();});
 const pu=document.getElementById('permUnclass'); if(pu) pu.onclick=()=>{ S.sheet='unclass'; render(); };
 host.querySelectorAll('[data-uc]').forEach(sel=>sel.onchange=()=>{
   const i = +sel.dataset.uc, v = sel.value;
   if(!v) return;
   if(v!=='skip'){ S.extra[v] = (S.extra[v]||0) + 1; }
   S.unclass.splice(i,1);
   if(!S.unclass.length) S.sheet = false;
   render();
 });
}
function sheetPerms(){
 return Object.keys(PERMS).map(k=>{
  const v=S.perms[k];
  return `<div class="sheet-row">
    <div class="r1"><b>${esc(k==='docsource'?srcName()+' — Legal › Contracts':PERMS[k].name)}</b><span class="spacer"></span>
      ${v&&v!=='denied'?`<span class="tag ${v==='always'?'tag--always':''}">${v==='always'?'Always':'This session'}</span>`
        :`<span class="tag">${v==='denied'?'Denied':'Not asked'}</span>`}</div>
    <div class="sm">${esc(permText(k,PERMS[k].scope))}</div>
    <div style="display:flex;gap:8px;margin-top:4px">
      ${v&&v!=='denied'?`<button class="btn btn--sm btn--quiet" data-sheet-revoke="${k}">Revoke</button>`:''}
      ${v==='once'?`<button class="btn btn--sm btn--quiet" data-sheet-always="${k}">Always allow</button>`:''}
    </div>
  </div>`;}).join('')
  + ((S.unclass && S.unclass.length) ? `<div class="sheet-row">
      <div class="r1"><b>${S.unclass.length} file${S.unclass.length===1?'':'s'} could not be placed</b><span class="spacer"></span>
        <button class="btn btn-sm" type="button" id="permUnclass">Review</button></div>
      <div class="sm">They are excluded from every count until someone says what they are.</div>
    </div>` : '')
  + `<div class="sheet-row"><span class="sm">Granted for this session only unless marked Always. Nothing is written back to any source, and revoking takes effect immediately.</span></div>`;
}
function sheetUnclass(){
 return (S.unclass||[]).map((u,i)=>`<div class="uc-row">
   <span class="uc-f"><b>${esc(u.f)}</b><span>${esc(u.why)}</span></span>
   <select class="uc-sel" data-uc="${i}" aria-label="Classify ${esc(u.f)}">
     <option value="">Classify…</option>
     ${TYPES.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}
     <option value="skip">Not a contract — ignore</option>
   </select>
 </div>`).join('')
 + `<div class="sheet-row"><span class="sm">Classifying a file adds it to that type's counts straight away. Nothing is moved or renamed in ${esc(srcName())}.</span></div>`;
}

/* ============================== init ============================== */
function resetApp(){
 Object.assign(S,{stage:'start',type:null,perms:S.perms,thread:[],qi:0,answers:[],sel:{},fromAnswer:{},
  langOpen:{},tierOff:{},provOff:{},headOpen:false,sel2:null,listTools:false,listSearch:false,canvasMax:false,tab:'all',show:'all',psearch:'',deferred:[],filter:'all',open:{},learnStarted:false,
  learnStep:0,pendingPerm:null,sheet:false,approval:null,grp:'popular',q:'',searching:false,homeConnect:false});
 render();
}
const $app = document.getElementById('app');
document.getElementById('railSearch').onclick = ()=>{
 resetApp(); S.searching=true; render();
 requestAnimationFrame(()=>{ const n=document.getElementById('libSearch'); if(n) n.focus(); });
};
document.getElementById('railToggle').onclick = ()=>{
 $app.setAttribute('data-rail', $app.getAttribute('data-rail')==='collapsed'?'expanded':'collapsed');
};
document.getElementById('split').addEventListener('pointerdown', e=>{
 const main=$main, start=e.clientX, rect=main.getBoundingClientRect();
 const cur = main.style.getPropertyValue('--artifact-w') || '54%';
 const startW = cur.endsWith('%') ? rect.width*parseFloat(cur)/100 : parseFloat(cur);
 main.setAttribute('data-dragging','true');
 const move=ev=>{ const w=Math.min(rect.width*0.78, Math.max(360, startW - (ev.clientX-start)));
   main.style.setProperty('--artifact-w', Math.round(w)+'px'); };
 const up=()=>{ main.removeAttribute('data-dragging');
   window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); };
 window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
});
document.addEventListener('keydown',e=>{
 if(S.stage!=='ask'||S.pendingPerm) return;
 const ae=document.activeElement;
 if(ae && (ae.tagName==='TEXTAREA'||ae.tagName==='INPUT')) return;
 const n=+e.key, qs=allQs(), q=qs[S.qi];
 if(q && n>=1 && n<=q.opts.length){ const o=q.opts[n-1];
   if(o.perm){ S.pendingPerm=o.perm; return renderDock(); }
   chooseOption(n-1,o.b); }
});
render();
</script>
