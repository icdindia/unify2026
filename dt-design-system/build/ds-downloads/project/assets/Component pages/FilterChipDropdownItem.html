<div class="dt-pv">
<section><p class="dt-pv-label">Example</p><div class="dt-pv-stage"><div><div role="listbox" aria-label="Options" style="margin: 1rem;"><button class="ODSFilterChipDropdownItem" type="button" role="option" aria-disabled="false" aria-selected="false"><div class="ODSRow ODSFilterChipDropdownItem-ContentFrame"><svg class="ODSIcon ODSFilterChipDropdownItem-IconBefore" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><g><path d="M11.9 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4"></path><path d="M6.956 3.574a1 1 0 0 0-1.94.488A7.55 7.55 0 0 0 8.4 8.66v9.405a1 1 0 0 0 .238.649l2.5 2.935a1 1 0 0 0 1.523-1.296l-2.261-2.656V15h2.125l1.832.977-.205 2.954a1 1 0 1 0 1.995.138l.25-3.6a1 1 0 0 0-.527-.951L13.4 13.2V9.691a7.54 7.54 0 0 0 5.411-3.598 1 1 0 1 0-1.716-1.026A5.545 5.545 0 0 1 6.956 3.574"></path></g></g></svg><span class="ODSFilterChipDropdownItem-Label">Option</span></div><div class="ODSRow ODSFilterChipDropdownItem-IconContainer"></div></button></div></div></div></section>

<script>
// Static ODS markup: wire the one universal behaviour (disclosure) so accordions and menus toggle.
document.addEventListener('click', function (e) {
  var b = e.target.closest('button[aria-expanded][aria-controls]');
  if (!b) return;
  var scope = b.closest('section') || document;
  var p = scope.querySelector('[id="' + b.getAttribute('aria-controls') + '"]');
  var open = b.getAttribute('aria-expanded') !== 'true';
  b.setAttribute('aria-expanded', String(open));
  if (p) { if (open) { p.removeAttribute('hidden'); p.style.maxHeight = 'none'; p.classList.add(p.classList[1] + '--expanded'); }
           else { p.setAttribute('hidden', ''); p.style.maxHeight = '0px'; p.classList.remove(p.classList[1] + '--expanded'); } }
  b.querySelectorAll('.ODSIcon').forEach(function (i) { i.style.transform = open ? 'rotate(180deg)' : ''; });
});
</script>
